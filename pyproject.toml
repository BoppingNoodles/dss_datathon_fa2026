[project]
name = "phoenix"
version = "0.1.0"
description = "Phoenix: reentry discovery for jobs, housing areas, and community services (DSS Datathon Fall 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7,<3",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
